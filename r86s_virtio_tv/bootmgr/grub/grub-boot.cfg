menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (R86S top-level entry; Intel Skylake and later GPU passthrough, Mesa graphics)" --id android-r86s_virtio_tv-top-intelskylakeandlater_mesa {
	set_android_default "android-r86s_virtio_tv-top-intelskylakeandlater_mesa"
	boot_android virtio_gpu.modeset=0 androidboot.gpu=i915 androidboot.graphics=mesa androidboot.hardware_vulkan=intel
}

submenu 'Advanced options (virtio_x86_64 specific)' --class format-list-bulleted --id advancedoptions-virtio_x86_64 {
	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel pre-Skylake GPU passthrough with workarounds, Mesa graphics)" --id android-virtio_x86_64-intelpreskylakewithworkarounds__mesa {
		set_android_default "advancedoptions-virtio_x86_64>android-virtio_x86_64-intelpreskylakewithworkarounds__mesa"
		boot_android virtio_gpu.modeset=0 androidboot.gpu=i915 androidboot.gpu_workaround=all androidboot.graphics=mesa androidboot.hardware_vulkan=intel_hasvk
	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel Skylake and later GPU passthrough, Mesa graphics)" --id android-virtio_x86_64-intelskylakeandlater_mesa {
		set_android_default "advancedoptions-virtio_x86_64>android-virtio_x86_64-intelskylakeandlater_mesa"
		boot_android virtio_gpu.modeset=0 androidboot.gpu=i915 androidboot.graphics=mesa androidboot.hardware_vulkan=intel
	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel GPU passthrough with workarounds, Swiftshader graphics)" --id android-virtio_x86_64-intelwithworkarounds_swiftshader {
		set_android_default "advancedoptions-virtio_x86_64>android-virtio_x86_64-intelwithworkarounds_swiftshader"
		boot_android virtio_gpu.modeset=0 androidboot.gpu=i915 androidboot.gpu_workaround=all androidboot.graphics=swiftshader
	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Intel GPU passthrough, Swiftshader graphics)" --id android-virtio_x86_64-intel_swiftshader {
		set_android_default "advancedoptions-virtio_x86_64>android-virtio_x86_64-intel_swiftshader"
		boot_android virtio_gpu.modeset=0 androidboot.gpu=i915 androidboot.graphics=swiftshader
	}
}

# The common configuration precedes this file and sets the default to the
# generic Android entry (index 0). Choose the R86S Intel entry on a fresh
# installation without overriding recovery/bootloader requests or a saved
# explicit menu choice.
if [ "$android_misc" != "boot-recovery" ] && [ "$android_misc" != "bootonce-bootloader" ]; then
    if [ "$grub_android_default" = "0" ]; then
        set default=android-r86s_virtio_tv-top-intelskylakeandlater_mesa
    fi
fi
